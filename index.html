<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arnub | Cybersecurity Terminal</title>
  <meta name="description" content="Md. Ibnul Bin Kader Arnub — PhD researcher in cybersecurity (VUW) and former SOC / Cyber Threat Intelligence professional. Interactive terminal portfolio.">
  <meta property="og:title" content="Arnub | Cybersecurity Terminal">
  <meta property="og:description" content="Interactive terminal portfolio — type 'help' to explore.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='18' fill='%2305080d'/><text x='50' y='66' font-size='52' text-anchor='middle' fill='%2300ff9c' font-family='monospace'>&gt;_</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="matrix" aria-hidden="true"></canvas>

  <main class="window">
    <header class="titlebar">
      <span class="dot red"></span><span class="dot yellow"></span><span class="dot green"></span>
      <span class="title">guest@sec-lab: ~ — arnub.sh</span>
      <span class="status"><span class="pulse"></span>SECURE</span>
    </header>

    <section id="terminal" aria-live="polite">
      <div id="output"></div>
      <div id="input-line">
        <span id="prompt"></span>
        <input id="cmd" type="text" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" aria-label="Terminal input">
      </div>
    </section>

    <nav id="quick" aria-label="Quick commands">
      <button data-cmd="help">help</button>
      <button data-cmd="whoami">whoami</button>
      <button data-cmd="experience">experience</button>
      <button data-cmd="skills">skills</button>
      <button data-cmd="certs">certs</button>
      <button data-cmd="research">research</button>
      <button data-cmd="ask">ask AI</button>
      <button data-cmd="contact">contact</button>
      <button data-cmd="clear">clear</button>
    </nav>
  </main>

  <noscript>
    <p style="color:#00ff9c;font-family:monospace;padding:20px">
      This terminal needs JavaScript. Contact: ibnul.ec@gmail.com · linkedin.com/in/rnb2kool
    </p>
  </noscript>

  <script src="script.js"></script>
</body>
</html>
